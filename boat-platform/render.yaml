databases:
  - name: boatconnect-db
    plan: free
    databaseName: boatconnect
    user: boatconnect

services:
  - type: web
    name: boatconnect
    runtime: node
    plan: free
    rootDir: boat-platform
    buildCommand: ls -la src/components/admin/ && npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boatconnect-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: boatconnect
          property: host
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
